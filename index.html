    @keyframes innerOutDown { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(90px); } }

    @keyframes rise { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: translateY(36px) scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes reveal { from { transform: translateY(108%); } to { transform: none; } }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

    @keyframes blink { 0%, 100% { box-shadow: 0 0 0 2px #161638, 0 0 0 6px rgba(216,222,0,0); } 50% { box-shadow: 0 0 0 2px #161638, 0 0 0 14px rgba(216,222,0,0.55); } }

      8.343%, 100% { transform: rotateY(90deg); }

    .p { animation: pop 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .f { animation: fadeIn 1.1s ease both; }
    .d1 { animation-delay: 0.45s; } .d2 { animation-delay: 0.55s; } .d3 { animation-delay: 0.65s; } .d4 { animation-delay: 0.75s; }
    .d5 { animation-delay: 0.85s; } .d6 { animation-delay: 0.95s; } .d7 { animation-delay: 1.05s; } .d8 { animation-delay: 1.15s; } .d9 { animation-delay: 1.25s; } .d10 { animation-delay: 1.35s; } .d11 { animation-delay: 1.45s; }

  <button class="fs" onclick="App.fullscreen()" aria-label="Toggle fullscreen" id="fsBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path><path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path></svg>
  </button>

<script>
(function () {
  const SLIDES = 15;
  const BGS = ['#C0D8FF', '#FFFFFF', '#F4F4F0', '#FFFFFF', '#F4F4F0', '#C0D8FF', '#F4F4F0', '#FFFFFF', '#161638', '#F4F4F0', '#FFFFFF', '#161638', '#C0D8FF', '#D8DE00', '#FFFFFF'];
  const DARK = [8, 11];
  const TRANSITION_MS = 750;
  const wrap = document.getElementById('wrap'), stage = document.getElementById('stage'), bgDeck = document.getElementById('bgDeck');
  const folds = [...document.querySelectorAll('.fold')];
  const dots = [...document.querySelectorAll('.dot')];
  let index = 0, prev = -1, locked = false, unlockTimer = null, wheelAcc = 0, wheelReset = null, touchY = null;
  let running = false, elapsed = 0, startedAt = null;

  function mount(i) { const f = folds[i]; if (!f.dataset.mounted) { f.appendChild(f.querySelector('template').content.cloneNode(true)); f.dataset.mounted = '1'; } }
  function unmount(i) { const f = folds[i]; if (f.dataset.mounted) { [...f.children].forEach(c => { if (c.tagName !== 'TEMPLATE') c.remove(); }); delete f.dataset.mounted; } }
  function render(dir) {
    wrap.style.background = BGS[index];
    wrap.classList.toggle('dark', DARK.includes(index));
    folds.forEach((f, k) => {
      f.classList.remove('hidden', 'enter-down', 'enter-up', 'leave-down', 'leave-up');
      if (k === index) { mount(k); if (prev !== -1) f.classList.add(dir > 0 ? 'enter-down' : 'enter-up'); }
      else if (k === prev) { f.classList.add(dir > 0 ? 'leave-down' : 'leave-up'); }
      else { f.classList.add('hidden'); unmount(k); }
    });
    dots.forEach((d, k) => d.classList.toggle('on', k === index));
    const showDeck = index === 8 || prev === 8;
    bgDeck.hidden = !showDeck; bgDeck.classList.toggle('out', index !== 8);
    if (index === 8 && prev !== 8) { bgDeck.style.animation = 'none'; void bgDeck.offsetWidth; bgDeck.style.animation = ''; }
    const v = folds[11].querySelector('video'); if (v) { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  }
  function jump(target) {
    const next = Math.max(0, Math.min(SLIDES - 1, target));
    if (locked || next === index) return;
    locked = true; const dir = next > index ? 1 : -1; prev = index; index = next; render(dir);
    clearTimeout(unlockTimer);
    unlockTimer = setTimeout(() => { locked = false; prev = -1; render(dir); }, TRANSITION_MS);
  }
  function go(d) { jump(index + d); }
  function resize() { const sc = Math.min(window.innerWidth / 1600, window.innerHeight / 900); stage.style.transform = 'translate(-50%, -50%) scale(' + sc + ')'; }
  window.addEventListener('resize', resize);
  window.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) return; e.preventDefault(); if (locked) return;
    wheelAcc += e.deltaY; clearTimeout(wheelReset); wheelReset = setTimeout(() => { wheelAcc = 0; }, 180);
    if (Math.abs(wheelAcc) > 60) { go(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; }
  }, { passive: false });
  window.addEventListener('touchstart', (e) => { touchY = e.touches[0] ? e.touches[0].clientY : null; }, { passive: true });
  window.addEventListener('touchend', (e) => { if (touchY == null || !e.changedTouches[0]) return; const dy = touchY - e.changedTouches[0].clientY; touchY = null; if (Math.abs(dy) > 50) go(dy > 0 ? 1 : -1); }, { passive: true });
  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA)$/.test(t.tagName))) return;
    if (e.key === ' ' && t && t.tagName === 'BUTTON') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') { e.preventDefault(); jump(0); }
    else if (e.key === 'End') { e.preventDefault(); jump(SLIDES - 1); }
  });
  // timer
  function elapsedMs() { return elapsed + (running && startedAt ? Date.now() - startedAt : 0); }
  function renderTimer() {
    const ms = elapsedMs(), total = Math.floor(ms / 1000);
    const hh = Math.floor(total / 3600), mm = Math.floor((total % 3600) / 60), ss = total % 60, pad = (n) => String(n).padStart(2, '0');
    const t = document.getElementById('timerText'), b = document.getElementById('timerBtn'), r = document.getElementById('resetBtn');
    if (!t) return;
    t.textContent = hh + ':' + pad(mm) + ':' + pad(ss); t.style.opacity = (running || ms > 0) ? 1 : 0.4;
    b.textContent = running ? 'Pause' : (ms > 0 ? 'Resume' : 'Start'); b.style.background = running ? '#D8DE00' : '#161638'; b.style.color = running ? '#161638' : '#FFFFFF';
    r.style.opacity = ms > 0 ? 1 : 0.35;
    let acc = 0;
    document.querySelectorAll('#progress .seg').forEach((seg) => {
      const dur = Number(seg.dataset.min) * 60000;
      const frac = Math.max(0, Math.min(1, (ms - acc) / dur));
      seg.querySelector('.segfill').style.width = (frac * 100).toFixed(2) + '%';
      seg.classList.toggle('done', frac >= 1);
      seg.classList.toggle('active', frac > 0 && frac < 1);
      acc += dur;
    });
  }
  setInterval(renderTimer, 200);
  window.App = {
    jump, go,
    toggleTimer() { if (running) { elapsed = elapsedMs(); running = false; startedAt = null; } else { running = true; startedAt = Date.now(); } renderTimer(); },
    resetTimer() { running = false; elapsed = 0; startedAt = null; renderTimer(); },
    fullscreen() { const el = document.documentElement; try { if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch (err) {} }
  };
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) document.getElementById('fsBtn').style.display = 'none';
  resize(); render(1);
})();
</script>
